name: Online demo

# Publishes the static online demo (docs/online/README.md) to GitHub Pages.
# Only the demo study and the lessons are published; the local app, which
# accepts medical scans, is never deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the online demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup
        env:
          OPENMRI_SETUP_PYTHON: python3.12
      - run: npm run lessons:check
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build:online
        env:
          # "/OpenMRI" on github.io, empty on a custom domain.
          OPENMRI_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-online

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
